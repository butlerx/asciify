version: 2

builds:
  - id: asciify
    main: ./cmd/asciify
    binary: asciify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# release-please owns the changelog and the GitHub release; goreleaser only
# attaches binaries to the release for the tag it is run against.
changelog:
  disable: true

release:
  mode: keep-existing
